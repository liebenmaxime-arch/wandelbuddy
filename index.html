* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
.app { max-width: 520px; margin: 0 auto; min-height: 100%; background: var(--surface); display: flex; flex-direction: column; position: relative; }
.main { flex: 1; padding-block: 18px 110px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 16px; }

/* cards */
.day { display: flex; flex-direction: column; gap: 10px; }
.card { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px; border-radius: 18px;
  background: var(--surface-2); border: 1px solid var(--line); text-align: left; width: 100%; }
.card.past { opacity: .62; }

.ticon svg { width: 24px; height: 24px; }
.cmeta { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ctitle { font-weight: 800; font-variant-numeric: tabular-nums; }
.csub { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cgoing { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--green); }
.avs { display: inline-flex; }
.avs span { width: 22px; height: 22px; border-radius: 50%; color: #fff; font-size: 10px; font-weight: 800; display: grid; place-items: center; border: 2px solid var(--surface-2); margin-left: -6px; }
.avs span:first-child { margin-left: 0; }
.pill { border: 0; border-radius: 999px; padding: 9px 14px; font-weight: 800; font-size: 13px; white-space: nowrap; }
.pill.join { background: var(--green); color: var(--green-ink); }
.pill.in { background: var(--green-soft); color: var(--green); }
.pill.full { background: var(--line); color: var(--muted); }
.empty { border: 1.5px dashed var(--line); border-radius: 18px; padding: 22px 18px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }

/* buttons & form */
.primary { background: var(--green); color: var(--green-ink); border: 0; border-radius: 14px; padding: 15px; font-weight: 800; font-size: 16px; width: 100%; }
.secondary { background: transparent; border: 1.5px solid var(--line); border-radius: 14px; padding: 13px; font-weight: 700; width: 100%; }
.danger { background: transparent; border: 0; color: #B3402A; font-weight: 700; padding: 10px; }
.back { border: 0; background: transparent; font-weight: 800; color: var(--green); padding: 6px 0; align-self: flex-start; }
.field { display: flex; flex-direction: column; gap: 8px; }
.field > span { font-size: 13px; font-weight: 700; color: var(--muted); }

.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 9px 13px; font-weight: 700; font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; gap: 6px; }

.othertime.on { border-color: var(--green); color: var(--green); }
.card.new { box-shadow: 0 0 0 3px var(--orange-soft); border-color: var(--orange); }

.lungs { background: var(--surface-2); border: 1px solid var(--line); border-radius: 20px; padding: 16px; display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 14px; align-items: center; }

.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

.hero .ticon { width: 58px; height: 58px; border-radius: 18px; }

.fact small { color: var(--muted); font-size: 12px; font-weight: 600; }
.fact b { font-size: 15px; overflow-wrap: anywhere; }
.people { display: flex; flex-direction: column; gap: 8px; }
.person { display: flex; align-items: center; gap: 10px; }
.av { width: 34px; height: 34px; border-radius: 50%; color: #fff; font-weight: 800; font-size: 13px; display: grid; place-items: center; flex: none; }
.person small { color: var(--muted); display: block; }
.box { background: var(--surface-2); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }

/* samen */
.goal { background: var(--green); color: var(--green-ink); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.goal .num { font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
.bar { height: 10px; border-radius: 999px; background: rgba(255,255,255,.25); overflow: hidden; }

.stat small { font-size: 12px; color: var(--muted); font-weight: 600; line-height: 1.3; }
.badges { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.badge { border: 1.5px solid var(--line); border-radius: 16px; padding: 12px; display: flex; gap: 10px; align-items: flex-start; }

.badge b { display: block; font-size: 14px; }
.badge span { font-size: 12px; color: var(--muted); line-height: 1.35; }

/* nav */
.nav { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: 520px; background: var(--surface); border-top: 1px solid var(--line);

body { margin: 0; -webkit-tap-highlight-color: transparent; }

// ---------- gedeelde store (Firebase Firestore) ----------
function sharedStore(F, db) {
  const { collection, doc, setDoc, updateDoc, deleteDoc, addDoc, onSnapshot, query, orderBy, limit } = F;
  const t0 = Date.now();
  const timer = setTimeout(() => { if (!S.loadedActs) { S.offline = true; refresh(); } }, 10000);
  const fail = (e) => { console.error(e); if (e && e.code === 'permission-denied') S.denied = true; S.offline = true; refresh(); };
  const wrap = async (p) => { try { return await p; } catch (e) { console.error(e); toast(e && e.code === 'permission-denied' ? 'De database weigert dit. Kijk de regels in Firebase na (stap 4 van de uitleg).' : 'Dat lukte niet. Controleer je verbinding en probeer opnieuw.'); throw e; } };
  const rows = (s) => s.docs.map((d) => ({ id: d.id, ...d.data() }));
  return {
    start() {
      onSnapshot(query(collection(db, 'activities'), orderBy('date', 'desc'), limit(500)), (s) => {
        S.acts = rows(s);
        if (S.loadedActs) for (const ch of s.docChanges()) {
          if (ch.type !== 'added') continue;
          const a = { id: ch.doc.id, ...ch.doc.data() };
          if (a.by !== S.me && (a.createdAt || 0) > t0 - 60000 && !isPast(a)) notify(a);
        }
        S.loadedActs = true; S.offline = false; S.denied = false; clearTimeout(timer); refresh();
      }, fail);
      onSnapshot(collection(db, 'joins'), (s) => { S.joins = rows(s); refresh(); }, fail);
      onSnapshot(collection(db, 'users'), (s) => { const u = {}; s.docs.forEach((d) => { u[d.id] = d.data(); }); S.users = u; refresh(); }, fail);
      onSnapshot(collection(db, 'views'), (s) => { S.views = rows(s); for (const v of S.views) if (v.uid === S.me) S.seen.add(v.act); refresh(); }, () => {});
      onSnapshot(query(collection(db, 'events'), orderBy('at', 'desc'), limit(5000)), (s) => { S.events = rows(s); if (S.tab === 'dash') refresh(); }, () => {});
      onSnapshot(doc(db, 'config', 'main'), (d) => { S.cfg = d.exists() ? d.data() : null; refresh(); }, () => {});
    },
    async profile(p) { await wrap(setDoc(doc(db, 'users', S.me), p, { merge: true })); },
    async create(a) {
      const ref = doc(collection(db, 'activities')); const data = { ...a, by: S.me, createdAt: Date.now() };
      await wrap(setDoc(ref, data));
      if (!S.acts.some((x) => x.id === ref.id)) S.acts = [...S.acts, { id: ref.id, ...data }];
      const jid = `${ref.id}__${S.me}`;
      try { await wrap(setDoc(doc(db, 'joins', jid), { act: ref.id, uid: S.me, steps: null, at: Date.now() })); if (!S.joins.some((x) => x.id === jid)) S.joins = [...S.joins, { id: jid, act: ref.id, uid: S.me, steps: null }]; } catch (e) {}
      return ref.id;
    },
    async join(act) { await wrap(setDoc(doc(db, 'joins', `${act}__${S.me}`), { act, uid: S.me, steps: null, at: Date.now() })); },
    async leave(act) { await wrap(deleteDoc(doc(db, 'joins', `${act}__${S.me}`))); },
    async remove(act) {
      await wrap(deleteDoc(doc(db, 'activities', act)));
      for (const j of S.joins.filter((x) => x.act === act)) { try { await deleteDoc(doc(db, 'joins', j.id)); } catch (e) {} }
    },
    async config(c) { await wrap(setDoc(doc(db, 'config', 'main'), c, { merge: true })); },
    async view(act) { try { await setDoc(doc(db, 'views', `${act}__${S.me}`), { act, uid: S.me, at: Date.now() }); } catch (e) {} },
    async track(kind, extra = {}) { try { await addDoc(collection(db, 'events'), { kind, uid: S.me, at: Date.now(), ...extra }); } catch (e) {} },
  };
}

function dashData() {

  const pastActs = acts.filter(isPast);

  const saw = new Set(views.map((v) => v.uid)); const tapped = new Set(extraJoins.map((j) => j.uid)); const planners = new Set(acts.map((a) => a.by));
  const groupSizes = pastActs.map((a) => joins.filter((j) => j.act === a.id).length).filter((n) => n > 0);
  const count = (arr, key) => { const m = {}; arr.forEach((x) => { const k = key(x); m[k] = (m[k] || 0) + 1; }); return Object.entries(m).sort((a, b) => b[1] - a[1])[0]; };
  const topTime = count(acts, (a) => a.time); const topType = count(joins, (j) => actById(j.act).type);

    opens: opens.filter((e) => e.uid === u).length, seen: views.filter((v) => v.uid === u).length,

    activeToday: new Set(S.events.filter((e) => e.kind === 'open' && ymd(new Date(e.at || 0)) === todayStr()).map((e) => e.uid)).size,
  };
}

    </div>
    <h2>Van zien naar meedoen</h2>
    <p class="note">Telt mensen, niet klikken. Iemand telt als "gezien" zodra een activiteit van een ander op zijn scherm verscheen.</p>
    <div class="box funnel">
      ${fr('Testers die zich aanmeldden', total, total, '')}
      ${fr('Zagen minstens één activiteit', D.saw.size, total)}
      ${fr('Tikten minstens één keer op Doe mee', D.tapped.size, total)}
      ${fr('Planden zelf iets', D.planners.size, total)}
    </div>
    <div class="kpis">
      <div class="kpi"><b>${conv}%</b><small>van de keren dat iemand een activiteit zag, deed die mee</small><span class="sub">${D.extraJoins.length} van ${D.views.length}</span></div>
      <div class="kpi"><b>${D.notifShown}</b><small>meldingen getoond</small><span class="sub">${D.notifJoin} keer meteen "Ik ga mee"</span></div>
      <div class="kpi"><b>${D.topTime ? hhmm(D.topTime[0]) : '–'}</b><small>populairste uur</small><span class="sub">${D.topType ? esc(TYPES[D.topType[0]]?.label || '') + ' is favoriet' : ''}</span></div>
    </div>
    <h2>Per activiteit</h2>
    <div class="tablewrap"><table class="t"><thead><tr><th>Wanneer</th><th>Wat</th><th>Door</th><th class="n">Gezien</th><th class="n">Doe mee</th><th class="n">%</th></tr></thead><tbody>
      ${D.perAct.map((r) => `<tr><td>${esc(shortDay(r.a.date))} ${hhmm(r.a.time)}</td><td>${esc(TYPES[r.a.type]?.label || r.a.type)}</td><td>${esc(realName(r.a.by))}</td><td class="n">${r.seen}</td><td class="n">${r.joined}</td><td class="n">${r.seen ? r.conv + '%' : '–'}</td></tr>`).join('') || '<tr><td colspan="6" class="muted">Nog geen activiteiten in deze periode.</td></tr>'}
    </tbody></table></div>
    <h2>Per tester</h2>
    <p class="note">Alleen voor jullie test. In het echte product zou een werkgever enkel totalen zien, niet wat elke medewerker apart doet (privacy).</p>
    <div class="tablewrap"><table class="t"><thead><tr><th>Naam</th><th>Bedrijf</th><th class="n">Geopend</th><th class="n">Gezien</th><th class="n">Mee</th><th class="n">Gepland</th><th class="n">Stappen</th></tr></thead><tbody>
      ${D.perUser.map((r) => `<tr><td>${esc(r.name)}</td><td>${esc(r.company)}</td><td class="n">${r.opens}</td><td class="n">${r.seen}</td><td class="n">${r.joined}</td><td class="n">${r.planned}</td><td class="n">${fmtN(r.steps)}</td></tr>`).join('') || '<tr><td colspan="7" class="muted">Nog niemand aangemeld.</td></tr>'}
    </tbody></table></div>
    <div class="row"><button class="secondary" type="button" data-act="csv-users" style="flex:1">Download testers (CSV)</button><button class="secondary" type="button" data-act="csv-acts" style="flex:1">Download activiteiten (CSV)</button></div>
    <details id="dcfg" class="box"><summary style="cursor:pointer;font-weight:800">Doelen en beloning aanpassen</summary>
      <div class="field" style="margin-top:10px"><span>Samen-momenten deze maand</span><input class="text" id="cgoal" type="number" min="1" max="10000" value="${Math.max(1, Number(cfg.goal) || 40)}"></div>
      <div class="field"><span>Stappendoel deze maand (vult de longen)</span><input class="text" id="cstepgoal" type="number" min="1000" max="10000000" step="1000" value="${Math.max(1000, Number(cfg.stepGoal) || 50000)}"></div>
      <div class="field"><span>Beloning</span><input class="text" id="creward" type="text" maxlength="100" value="${esc(cfg.reward || '')}" placeholder="bv. ontbijt voor iedereen"></div>
      <button class="pill join" type="button" data-act="cfg" style="align-self:flex-start">Opslaan</button></details>`;
}
function csvDownload(name, rows) {
  const txt = '﻿' + rows.map((r) => r.map((c) => { const s = String(c ?? ''); return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(';')).join('\r\n');
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'text/csv;charset=utf-8' })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); toast('Download gestart. Open het bestand in Excel.'); }
  catch (e) { toast('Downloaden lukte niet in deze browser.'); }
}

// ---------- koppelen met Firebase ----------
function vSetup() {
  const st = S.setupState || {};
  return `<button class="back" type="button" data-act="home">‹ Terug</button>
    <div><h1>Firebase koppelen</h1><p class="muted">Plak hieronder de config die Firebase je toont (het blok met <b>apiKey</b>, <b>projectId</b> enzovoort). Je mag gerust te veel kopiëren.</p></div>
    <textarea class="text textarea" id="cfgtxt" placeholder="const firebaseConfig = {\n  apiKey: &quot;…&quot;,\n  authDomain: &quot;…&quot;,\n  projectId: &quot;…&quot;,\n  …\n};" spellcheck="false"></textarea>
    <button class="primary" type="button" data-act="cfgtest">1. Test de verbinding</button>
    ${st.msg ? `<div class="status ${st.kind}">${esc(st.msg)}</div>` : ''}
    <button class="${st.ok ? 'primary' : 'secondary'}" type="button" data-act="cfgdl">2. Download index.html met deze koppeling</button>
    <p class="note">Zet het gedownloade bestand daarna online via Netlify (stap 6 van de uitleg). Iedereen die die link opent, zit in dezelfde gedeelde Wandelbuddy.</p>`;
}
async function testCfg(cfg) {
  const { F, db } = await loadFirebase(cfg, 'test' + Date.now());
  return Promise.race([
    F.getDoc(F.doc(db, 'config', 'main')).then(() => ({ ok: true })),
    new Promise((r) => setTimeout(() => r({ ok: false, code: 'timeout' }), 9000)),
  ]);
}

// ---------- render ----------
let lastKey = '';
const viewKey = () => (S.setup ? 'setup' : needsWelcome() ? 'welcome' : S.draft ? 'draft' : S.detail ? 'detail:' + S.detail : 'tab:' + S.tab);
const needsWelcome = () => S.mode === 'shared' && (S.editProfile || !ls.get('wb-name') && !(S.users[S.me] && S.users[S.me].name));
function render(preserve = false) {
  if (S.mode === 'loading') return;
  const main = $('#main'); const key = viewKey();
  const keep = {}; let focusId = null, selS = null, selE = null; let openD = [];
  if (preserve && key === lastKey) {
    main.querySelectorAll('input[id],textarea[id]').forEach((el) => { keep[el.id] = el.value; });
    openD = [...main.querySelectorAll('details[id]')].filter((d) => d.open).map((d) => d.id);
    const ae = document.activeElement; if (ae && ae.id && main.contains(ae)) { focusId = ae.id; try { selS = ae.selectionStart; selE = ae.selectionEnd; } catch (e) {} }
  }
  let html;
  if (S.setup) html = vSetup();
  else if (needsWelcome()) html = vWelcome();
  else if (S.draft) html = vCreate();
  else if (S.detail) html = vDetail();
  else html = S.tab === 'samen' ? vSamen() : S.tab === 'dash' ? vDash() : vAgenda();
  main.innerHTML = html;
  for (const id in keep) { const el = document.getElementById(id); if (el) el.value = keep[id]; }
  openD.forEach((id) => { const d = document.getElementById(id); if (d) d.open = true; });
  if (focusId) { const el = document.getElementById(focusId); if (el) { el.focus({ preventScroll: true }); try { if (selS != null) el.setSelectionRange(selS, selE); } catch (e) {} } }
  lastKey = key;
  const bare = S.setup || key === 'welcome';
  $('.nav').hidden = bare;
  document.querySelectorAll('.tab').forEach((b) => b.setAttribute('aria-current', !S.draft && !S.detail && b.dataset.tab === (S.tab === 'dash' ? 'samen' : S.tab) ? 'page' : 'false'));
  if (S.notifQ.length) showPop();
  if (!bare) checkReminders();
  // "gezien" bijhouden: welke activiteiten van anderen verschenen op dit scherm
  if (!bare && document.visibilityState === 'visible') {
    const ids = key.startsWith('detail:') ? [S.detail] : key === 'tab:agenda' ? [...main.querySelectorAll('[data-open]')].map((e) => e.dataset.open) : [];
    for (const id of ids) { const a = actById(id); if (a && a.by !== S.me && !S.seen.has(id)) { S.seen.add(id); store.view(id); } }
  }
}
const refresh = () => render(true);

// ---------- events ----------
async function handle(el) {
  if (el.dataset.tab || el.dataset.open || el.dataset.act === 'new') S.justAdded = null;
  if (el.dataset.pop) {
    const q = S.notifQ.shift() || {}; const id = q.id; const k = el.dataset.pop;
    if (k === 'ok' && id) store.track('reminder_ok', { act: id });
    if (k === 'cancel' && id) { try { await store.leave(id); store.track('leave', { act: id, from: 'reminder' }); toast('Je bent afgemeld. De anderen zien het meteen.'); } catch (e) {} }
    if (k === 'join' && id) { try { await store.join(id); store.track('notif_join', { act: id }); toast('Je doet mee. Tot straks!'); } catch (e) {} }
    if (k === 'open' && id) { store.track('notif_open', { act: id }); S.detail = id; S.draft = null; S.setup = false; S.tab = 'agenda'; render(); window.scrollTo(0, 0); }
    if (!S.notifQ.length) document.title = BASE_TITLE;
    showPop(); return;
  }
  if (el.dataset.filter) { S.filter = el.dataset.filter; render(); return; }
  if (el.dataset.period) { S.period = el.dataset.period; render(); return; }
  if (el.dataset.tab) { S.tab = el.dataset.tab; S.detail = null; S.draft = null; S.setup = false; history.replaceState(null, '', S.tab === 'dash' ? '#dashboard' : location.pathname + location.search); render(); window.scrollTo(0, 0); return; }
  if (el.dataset.join) { try { await store.join(el.dataset.join); toast('Je doet mee. Tot straks!'); } catch (e) {} return; }
  if (el.dataset.open) { S.detail = el.dataset.open; S.confirmDel = false; render(); window.scrollTo(0, 0); return; }
  if (el.dataset.set) {
    const k = el.dataset.set; let v = el.dataset.val;
    if (k === 'dur') v = Number(v);
    if (k === 'type') { S.draft.dur = TYPES[v].dur; if (v === 'padel' && PLACES.includes(S.draft.place)) S.draft.place = 'Padelclub'; if (v !== 'padel' && S.draft.place === 'Padelclub') S.draft.place = 'Inkom'; }
    if (k === 'place') { const ip = $('#cplace'); if (ip) ip.value = ''; }
    if (k === 'time') { const ct = $('#ctime'); if (ct) ct.value = ''; }
    readDraftInputs(); S.draft[k] = v; render(); return;
  }
  const act = el.dataset.act;
  if (act === 'home') { S.detail = null; S.draft = null; S.setup = false; S.editProfile = false; render(); return; }
  if (act === 'new') { const ns = nextSlot(); S.draft = { type: 'wandelen', date: ns.date, time: ns.time, dur: 20, place: 'Inkom', note: '' }; S.detail = null; S.setup = false; render(); window.scrollTo(0, 0); return; }
  if (act === 'welcome') {
    const name = $('#wname').value.trim().slice(0, 40); const company = $('#wcomp').value.trim().slice(0, 60);
    if (name.length < 2) { toast('Vul je naam in, zodat collega\'s weten wie meedoet.'); $('#wname').focus(); return; }
    ls.set('wb-name', name); ls.set('wb-company', company);
    const first = !S.editProfile && !(S.users[S.me] && S.users[S.me].joinedAt);
    S.users[S.me] = { ...(S.users[S.me] || {}), name, company };
    S.editProfile = false; render();
    try { await store.profile({ name, company, lastSeen: Date.now(), ...(first ? { joinedAt: Date.now() } : {}) }); if (first) toast(`Welkom, ${name.split(' ')[0]}!`); else toast('Opgeslagen.'); } catch (e) {}
    return;
  }
  if (act === 'profile') { S.editProfile = true; render(); window.scrollTo(0, 0); return; }
  if (act === 'post') {
    readDraftInputs(); const d = S.draft;
    if (!d.place.trim()) { toast('Kies of typ een vertrekpunt.'); return; }
    if (isPast({ date: d.date, time: d.time, dur: 0 })) { toast('Dat uur is al voorbij. Kies een later uur of een andere dag.'); return; }
    const payload = { type: d.type, date: d.date, time: d.time, dur: d.dur, place: d.place.trim().slice(0, 60), note: d.note.trim().slice(0, 100) };
    if (TYPES[d.type].max) payload.max = TYPES[d.type].max;
    el.disabled = true;
    try {
      const id = await store.create(payload); store.track('create', { act: id });
      S.draft = null; S.detail = null; S.tab = 'agenda'; S.filter = 'all'; S.justAdded = id; render();
      const c = document.querySelector(`[data-open="${id}"]`);
      if (c) c.scrollIntoView({ block: 'center', behavior: 'smooth' }); else window.scrollTo(0, 0);
      toast(`Geplaatst: ${dayLabel(payload.date).toLowerCase()} om ${hhmm(payload.time)}. Iedereen ziet het nu.`);
    } catch (e) { el.disabled = false; }
    return;
  }
  if (act === 'join') { try { await store.join(S.detail); toast('Je doet mee. Tot straks!'); } catch (e) {} return; }
  if (act === 'leave') { try { await store.leave(S.detail); store.track('leave', { act: S.detail }); toast('Je bent afgemeld.'); } catch (e) {} return; }
  if (act === 'del') { if (!S.confirmDel) { S.confirmDel = true; render(); return; } try { await store.remove(S.detail); S.detail = null; S.confirmDel = false; render(); toast('Activiteit verwijderd.'); } catch (e) {} return; }
  if (act === 'share') {
    const a = actById(S.detail); const t = TYPES[a.type]; const link = /^https?:/.test(location.href) ? ' ' + location.href.split('#')[0] : '';
    const txt = `${t.label} ${dayLabel(a.date).toLowerCase()} om ${hhmm(a.time)}, ${a.dur} min, vertrek: ${a.place}.${a.note ? ' ' + a.note + '.' : ''} Wie doet mee? Zet je erbij in Wandelbuddy:${link}`;
    try { await navigator.clipboard.writeText(txt); toast('Uitnodiging gekopieerd.'); } catch (e) { toast(txt); }
    return;
  }
  if (act === 'cfg') {
    const goal = Math.max(1, Math.min(10000, Math.round(Number($('#cgoal').value) || 40)));
    const stepGoal = Math.max(1000, Math.min(10000000, Math.round(Number($('#cstepgoal').value) || 50000)));
    const reward = $('#creward').value.trim().slice(0, 100);
    try { await store.config({ goal, stepGoal, reward }); toast('Doelen opgeslagen.'); } catch (e) {} return;
  }
  if (act === 'csv-users') { const D = dashData(); csvDownload('wandelbuddy-testers.csv', [['Naam', 'Bedrijf', 'Keer geopend', 'Activiteiten gezien', 'Doe mee getikt', 'Zelf gepland', 'Stappen', 'Beweegminuten'], ...D.perUser.map((r) => [r.name, r.company, r.opens, r.seen, r.joined, r.planned, r.steps, r.minutes])]); return; }
  if (act === 'csv-acts') { const D = dashData(); csvDownload('wandelbuddy-activiteiten.csv', [['Datum', 'Uur', 'Activiteit', 'Duur (min)', 'Vertrek', 'Georganiseerd door', 'Gezien door', 'Doe mee getikt', 'Totaal deelnemers', 'Conversie %'], ...D.perAct.map((r) => [r.a.date, r.a.time, TYPES[r.a.type]?.label || r.a.type, r.a.dur, r.a.place, realName(r.a.by), r.seen, r.joined, r.total, r.seen ? r.conv : ''])]); return; }
  if (act === 'notifperm') { try { const p = await Notification.requestPermission(); toast(p === 'granted' ? 'Meldingen staan aan op dit toestel.' : 'Meldingen niet toegestaan. In de app krijg je ze wel.'); } catch (e) { toast('Deze browser ondersteunt dat niet. In de app krijg je ze wel.'); } render(); return; }
  if (act === 'simulate') { S.tab = 'agenda'; render(); store.simulate(); return; }
  if (act === 'reset') { await store.reset(); S.detail = null; S.notifQ = []; S.reminded = new Set(); ls.set('wb-reminded', '[]'); showPop(); toast('Demo opnieuw gestart.'); return; }
  if (act === 'setup') { S.setup = true; S.setupState = {}; render(); window.scrollTo(0, 0); return; }
  if (act === 'cfgtest' || act === 'cfgdl') {
    const cfg = parseCfg($('#cfgtxt').value);
    if (!cfg) { S.setupState = { kind: 'bad', msg: 'Ik vind geen apiKey en projectId in wat je plakte. Kopieer het hele blok uit Firebase.' }; refresh(); return; }
    if (act === 'cfgdl') {
      const html = PRISTINE.replace(/(<script id="wb-config" type="text\/plain">)[\s\S]*?(<\/script>)/, `$1\n${JSON.stringify(cfg, null, 2)}\n$2`);
      try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([html], { type: 'text/html' })); a.download = 'index.html'; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); toast('index.html gedownload. Zet het nu op Netlify.'); }
      catch (e) { toast('Downloaden lukte niet. Gebruik een andere browser of plak de config handmatig.'); }
      return;
    }
    S.setupState = { kind: 'wait', msg: 'Verbinden met Firebase…' }; refresh();
    try {
      const r = await testCfg(cfg);
      S.setupState = r.ok ? { ok: true, kind: 'ok', msg: '✓ Verbonden! De database werkt. Download nu je index.html.' } : { kind: 'bad', msg: 'Geen antwoord van Firebase. Bestaat de Firestore-database al (stap 3)? Ben je online?' };
    } catch (e) {
      const c = e && e.code;
      S.setupState = { kind: 'bad', msg: c === 'permission-denied' ? 'Verbonden, maar de regels staan nog niet open. Plak de regels uit stap 4 en klik Publish.' : (c === 'not-found' || c === 'failed-precondition') ? 'Het project is gevonden, maar er is nog geen Firestore-database. Maak die aan (stap 3).' : 'Er ging iets mis: ' + ((e && e.message) || e) };
    }
    refresh(); return;
  }
}
function readDraftInputs() {
  if (!S.draft) return;
  const p = $('#cplace'); if (p && p.value.trim()) S.draft.place = p.value;
  const n = $('#cnote'); if (n) S.draft.note = n.value;
  const t = $('#ctime'); if (t && t.value) S.draft.time = t.value;
}
document.addEventListener('click', (e) => { const el = e.target.closest('[data-tab],[data-join],[data-open],[data-set],[data-act],[data-pop],[data-period],[data-filter]'); if (el) { e.stopPropagation(); handle(el); } });
document.addEventListener('keydown', (e) => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-open]')) { e.preventDefault(); handle(e.target); }
  if (e.key === 'Enter' && (e.target.id === 'wname' || e.target.id === 'wcomp')) { e.preventDefault(); handle($('[data-act="welcome"]')); }
});
document.addEventListener('change', (e) => { if ((e.target.id === 'ctime' || e.target.id === 'cplace') && S.draft) { readDraftInputs(); render(); } });
window.addEventListener('hashchange', () => { if (location.hash === '#dashboard') { S.tab = 'dash'; S.detail = null; S.draft = null; render(); } });
// herinnering 10 minuten voor de start van iets waaraan je meedoet
function checkReminders() {
  if (S.mode === 'loading' || !S.me || !store) return;
  const now = new Date(); const nowMin = now.getHours() * 60 + now.getMinutes(); const t = todayStr();
  for (const a of S.acts) {
    if (a.date !== t || !iJoined(a.id) || S.reminded.has(a.id)) continue;
    const left = toMin(a.time) - nowMin;
    if (left > 0 && left <= 10) {
      S.reminded.add(a.id); ls.set('wb-reminded', JSON.stringify([...S.reminded].slice(-200)));
      S.notifQ.push({ id: a.id, kind: 'remind' }); showPop(); chime();
      try { if (navigator.vibrate) navigator.vibrate([200, 80, 200]); } catch (e) {}
      if (document.hidden) { document.title = '⏰ Over ' + left + ' min · ' + BASE_TITLE; try { if ('Notification' in window && Notification.permission === 'granted') new Notification(`Over ${left} minuten: ${(TYPES[a.type] || TYPES.wandelen).label.toLowerCase()}`, { body: `Vertrek aan ${a.place}`, tag: 'r' + a.id }); } catch (e) {} }
      store.track('reminder_shown', { act: a.id });
    }
  }
}
// elke dag schuiven de datums mee: na middernacht (of als de app lang open staat) alles opnieuw berekenen
let lastDay = todayStr();
setInterval(() => {
  if (S.mode === 'loading') return;
  checkReminders();
  const day = todayStr();
  if (day !== lastDay) { lastDay = day; if (S.draft) { S.draft.date = draftDays()[0]; render(); return; } }
  if (!S.draft) refresh();
}, 20000);

// ---------- start ----------
async function boot() {
  if (location.hash === '#dashboard') S.tab = 'dash';
  if (location.hash === '#koppelen' && !S.cfgFile) S.setup = true;
  const cfg = S.cfgFile;
  if (cfg) {
    try {
      const { F, db } = await loadFirebase(cfg);
      let uid = ls.get('wb-uid'); if (!uid) { uid = 'u_' + rid(); ls.set('wb-uid', uid); }
      S.mode = 'shared'; S.me = uid; store = sharedStore(F, db); store.start(); render();
      if (ls.get('wb-name')) { trackOpen(); } else { const w = setInterval(() => { if (ls.get('wb-name')) { clearInterval(w); trackOpen(); } }, 1000); }
      return;
    } catch (e) {
      console.error(e);
      $('#main').innerHTML = `<div class="banner"><b>Firebase laadt niet</b>Controleer je internetverbinding en vernieuw de pagina. (${esc(e && e.message || e)})</div>`;
      return;
    }
  }
  S.mode = 'local'; store = localStore(); store.start(); render();
}
boot();
</script>
