<!doctype html>
<html lang="nl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F4E3D">
<title>Wandelbuddy</title>
<!-- web-app op het beginscherm -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wandelbuddy">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">

</head>
<body>
<div class="app">
  <main class="main" id="main" aria-live="polite"><p class="loading">Wandelbuddy laden…</p></main>
  <nav class="nav" aria-label="Navigatie">
    <button class="tab" type="button" data-tab="agenda" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Activiteiten</button>
    <button class="add" type="button" data-act="new" aria-label="Nieuwe activiteit">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button>
    <button class="tab" type="button" data-tab="samen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"></circle><circle cx="17" cy="9" r="2.6"></circle><path d="M3 20c.6-3.4 3-5.4 6-5.4s5.4 2 6 5.4M15.5 14.7c2.6-.3 4.8 1.4 5.5 4.3"></path></svg>Samen</button>
  </nav>
  <div class="toast" id="toast" role="status" hidden=""></div>
</div>
<div class="pop-wrap" id="pop" hidden=""></div>
<script type="module" src="app.js"></script>
</body>
</html>
